# 发布已停用：当前仅保留 workflow_dispatch 手动触发。恢复发布前需完成以下前置条件：
# 1. 在 GitHub 仓库 Settings → Environments 创建名为 nuget 的环境（下方 publish job 的 environment 已引用，缺失会导致运行失败）；
# 2. 确认 nuget.org 上 MeowDown 包 ID 的所有权归属（未发布过的 ID 由首个推送者取得所有权）；
# 3. 更新下方 "NuGet login" 步骤中写死的 user（现为 LOVAHE，需改为实际持有所有权/令牌的账号）。
name: Publish NuGet

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  DOTNET_SDK_VERSION: "9.0.317"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish:
    name: Publish MeowDown
    runs-on: ubuntu-latest
    environment: nuget

    steps:
      - name: Ensure release tag
        run: |
          test "$GITHUB_REF_TYPE" = "tag"
          case "$GITHUB_REF_NAME" in
            v*) ;;
            *) exit 1 ;;
          esac

      - name: Ensure release is published
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --json tagName,isDraft,isPrerelease \
            | jq -e --arg tag "$GITHUB_REF_NAME" \
              '.tagName == $tag and .isDraft == false and .isPrerelease == ($tag | contains("-"))'

      - name: Checkout
        uses: actions/checkout@v7

      - name: Ensure tag matches package version
        shell: bash
        run: |
          set -euo pipefail
          project_version=$(sed -n 's:.*<Version>\([^<]*\)</Version>.*:\1:p' MeowDown/MeowDown.csproj)
          test -n "$project_version"
          test "$GITHUB_REF_NAME" = "v${project_version}"

      - name: Set up dotnet
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_SDK_VERSION }}

      - name: Restore
        run: dotnet restore MeowDown.sln

      - name: Build
        run: dotnet build MeowDown.sln -c Release -m:1 --no-restore

      - name: Pack
        run: dotnet pack MeowDown/MeowDown.csproj -c Release -o artifacts --no-build

      - name: NuGet login
        id: login
        uses: NuGet/login@v1
        with:
          user: LOVAHE

      - name: Push package
        run: dotnet nuget push artifacts/*.nupkg --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json
